<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соцочка</title>
<link rel="apple-touch-icon" href="icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png?v=3">
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e2ded6;--gold:#c8940e;--red:#e5484d;--yellow:#e8a317;--green:#30a46c}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#222;--text:#f2f2f2;--muted:#9a9a9a;--line:#3a3a3a;--gold:#f0c040}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:440px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:32px;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px}
h2{font-size:15px;color:var(--muted);font-weight:500;margin:28px 0 10px}
h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
#me:invalid{border-color:var(--gold);color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0 10px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;color:inherit;text-decoration:none;border-left:4px solid var(--c,var(--card))}
.tile span{font-size:13px;color:var(--muted)}
.tile b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
/* вкладки — табуретка: сиденье сверху, четыре раздела — четыре ножки, ножка раздела, где ты сейчас, золотая */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:0 4px 6px;background:var(--card);border-radius:14px;border-top:6px solid var(--gold)}
.tabs a{text-align:center;padding:0 2px 4px;border-radius:0 0 10px 10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.tabs a::before{content:'';display:block;width:4px;height:10px;margin:0 auto 4px;border-radius:0 0 2px 2px;background:var(--line);transform:rotate(var(--tilt));transform-origin:top;transition:height .2s,background .2s}
.tabs a:nth-child(1){--tilt:14deg}.tabs a:nth-child(2){--tilt:5deg}.tabs a:nth-child(3){--tilt:-5deg}.tabs a:nth-child(4){--tilt:-14deg}
.tabs a.on{color:var(--text)}
.tabs a.on::before{background:var(--gold);height:16px}
.tabs a.owe::before{background:var(--red)}
.tabs b{display:block;font-size:22px;line-height:1.2}
section:not([hidden]){animation:slide .25s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(var(--dx,0))}}
@media (prefers-reduced-motion:reduce){section{animation:none!important}}
.red{--c:var(--red)}.yellow{--c:var(--yellow)}.green{--c:var(--green)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.nav button{font-size:20px;width:44px;height:44px;border:0;border-radius:12px;background:var(--card);color:var(--text);cursor:pointer}
.week{text-align:center;color:var(--muted)}
.week b{display:block;color:var(--text)}
.boss{text-align:center;margin:0 0 16px}
.row{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px}
a.row{color:inherit;text-decoration:none}
.mine{box-shadow:inset 0 0 0 2px var(--gold)}
.done{opacity:.55}
.head{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.end{margin-left:auto;flex:none}
.del{flex:none;border:0;background:none;padding:6px;opacity:.6}
.icon{font-size:32px;width:44px;text-align:center;flex:none}
.name{font-weight:600;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.score{margin-left:auto;color:var(--gold);font-weight:600;white-space:nowrap}
.rev,.row>details{margin:8px 0 0 58px;font-size:14px}
.rev{white-space:pre-line}
.rev .score{margin:0}
summary{cursor:pointer;color:var(--muted)}
.fold>summary{padding:4px 0 10px}
form{display:grid;gap:8px;margin-top:8px}
select,input,textarea,button{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
button{cursor:pointer}
.add{grid-template-columns:auto minmax(0,1fr) auto;margin:0 0 10px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{background:var(--c);color:#fff;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.bar{height:8px;background:var(--bg);border-radius:4px;margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.warn{color:var(--red);font-weight:600}
.ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hint{margin:-4px 0 10px}
.date{width:44px;flex:none;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.date b{display:block;font-size:22px;color:var(--text)}
.vote.on{background:var(--green);border-color:var(--green);color:#fff}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{text-transform:capitalize}
.calhead button{border:0;width:36px;height:36px;padding:0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.grid span{font-size:12px;color:var(--muted)}
.day{aspect-ratio:1;padding:0;border:0;background:none;position:relative}
.day.past{color:var(--muted)}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.day.sel{background:var(--bg)}
.day.has::after,.day.ok::after{content:'';position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--muted)}
.day.ok::after{background:var(--green)}
.dayinfo{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:4px}
.link{border:0;background:none;padding:4px 0;color:var(--gold);text-align:left}
</style>
</head>
<body>
<main>
<header><h1><img class="logo" src="icon.svg" alt="">Соцочка</h1><select id="me" required aria-label="Кто я"><option value="">Кто я?</option></select></header>
<div class="tiles" id="tiles"></div>
<nav class="tabs"><a href="#clean"><b>🧹</b>Уборка</a><a href="#home"><b>🏠</b>Дом</a><a href="#events"><b>🎉</b>События</a><a href="#my"><b>👤</b>Я</a></nav>

<section data-tab="clean">
<div class="nav"><button id="prev" aria-label="Неделя назад">←</button><div class="week" id="week"></div><button id="next" aria-label="Неделя вперёд">→</button></div>
<p class="boss" id="boss"></p>
<div id="list"></div>
<h2>Рейтинг</h2>
<div id="rating"></div>
</section>

<section data-tab="home" hidden>
<h2>Туалетная бумага</h2>
<div class="row" id="paper"></div>
<form id="buyForm" class="row" hidden>
  <input name="n" type="number" min="1" max="99" inputmode="numeric" placeholder="Сколько рулонов" aria-label="Сколько рулонов" required>
  <input name="price" type="number" min="1" max="100000" inputmode="numeric" placeholder="Сколько стоило, ₽" aria-label="Сколько стоило" required>
  <p class="muted small" id="buyShare">Скидываются все четверо поровну</p>
  <div class="two"><button type="button" id="buyCancel">Отмена</button><button>Готово</button></div>
</form>
<h2>Заявки: ремонт и покупки</h2>
<form id="reqForm" class="row add">
  <select name="kind" aria-label="Тип заявки"><option value="fix">🔧 Ремонт</option><option value="buy">🛒 Купить</option></select>
  <input name="text" maxlength="200" placeholder="Что нужно?" aria-label="Описание" required>
  <button aria-label="Добавить заявку">＋</button>
</form>
<div id="requests"></div>
</section>

<section data-tab="events" hidden>
<h2>Афиша — предлагай и голосуй</h2>
<p class="muted small hint">Событие в силе ✅, когда «за» трое из четверых</p>
<details class="fold" id="evFold"><summary>＋ Предложить событие</summary><form id="evForm" class="row">
  <input name="title" maxlength="100" placeholder="Кино, настолки, ужин…" aria-label="Что" required>
  <div class="two"><input name="date" type="date" aria-label="Дата" required><input name="time" type="time" aria-label="Время"></div>
  <button>Предложить</button>
</form></details>
<div id="events"></div>
<h2>Календарь</h2>
<div class="row" id="cal"></div>
</section>

<section data-tab="my" hidden>
<div id="my"></div>
</section>
</main>
<script src="shared.js"></script>
<script>
const kinds = {fix: '🔧', buy: '🛒'};
// Firebase Realtime Database (проект socochka, правила — database.rules.json)
// ponytail: без логина, любой со ссылкой может писать от чужого имени; Firebase Auth, если начнут хулиганить
const DB = 'https://socochka-default-rtdb.firebaseio.com';

const weekNow = (t = new Date()) => Math.floor((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - START) / WEEK);
const today = weekNow();
let w = today, shownW, tab, reviews = [], cleaned = {}, paper = null, buys = [], requests = [], events = [], note = 'Загрузка…';
let me = ''; try { me = localStorage.me || ''; } catch {}
let cal = new Date(), sel = '';
cal.setDate(1);

const mod = n => (n % 4 + 4) % 4;
const fmt = d => new Date(d).toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', timeZone: 'UTC'});
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const $ = id => document.getElementById(id);
const iso = d => d.toLocaleDateString('sv-SE'); // ГГГГ-ММ-ДД по местному времени
const day = s => new Date(s + 'T00:00');
const short = d => d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});
const stamp = ts => new Date(ts).toLocaleString('ru-RU', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
const plural = (n, f) => f[['one', 'few', 'many'].indexOf(new Intl.PluralRules('ru').select(n))] ?? f[2];
const lvl = n => n <= 2 ? ['red', 'мало'] : n <= 5 ? ['yellow', 'средне'] : ['green', 'достаточно'];
const ok = e => e.votes.length >= 3;
const share = b => Math.ceil(b.price / people.length); // бумагу оплачивают четверо поровну
const byWhen = (a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''));
const when = e => short(day(e.date)) + (e.time ? ' в ' + e.time : '');
// уведомление всем в ntfy; не дошло — не страшно, запись уже в базе
const notify = (message, tab) => fetch('https://ntfy.sh/', {method: 'POST', body: JSON.stringify({topic: TOPIC, title: 'Соцочка', message, click: SITE + '#' + tab})}).catch(() => {});

function render() {
  const tIso = iso(new Date()), nowBoss = bosses[mod(today)];
  const up = events.filter(e => e.date >= tIso).sort(byWhen), open = requests.filter(r => !r.done);
  const [pc, pw] = lvl(paper?.rolls ?? 0);

  // сводка сверху: главное с первого взгляда, тап ведёт во вкладку
  $('tiles').innerHTML = [
    ['clean', '', '👑 Староста', nowBoss],
    ['home', paper ? pc : '', '🧻 Бумага', paper ? `${paper.rolls} · ${pw}` : '—'],
    ['home', '', '🔧 Заявки', note ? '—' : open.length ? `${open.length} ${plural(open.length, ['открыта', 'открыты', 'открыто'])}` : 'всё сделано'],
    ['events', '', '🎉 Ближайшее', up[0] ? `${esc(up[0].title)}, ${short(day(up[0].date))}` : note ? '—' : 'пусто — предложи'],
  ].map(([t, c, k, v]) => `<a class="tile ${c}" href="#${t}"><span>${k}</span><b>${v}</b></a>`).join('');

  const label = {[today]: 'Эта неделя', [today + 1]: 'Следующая неделя', [today - 1]: 'Прошлая неделя'}[w] || '&nbsp;';
  $('week').innerHTML = `<b>${label}</b>${fmt(START + w * WEEK)} — ${fmt(START + w * WEEK + 6 * 864e5)}`;
  const boss = bosses[mod(w)];
  $('boss').textContent = `👑 Староста: ${boss} — принимает объекты`;

  // каждую неделю объекты сдвигаются вниз на одного человека
  // пока открыта форма отзыва, живое обновление её не стирает; при закрытии список перерисуется
  if (w !== shownW || !$('list').querySelector('details[open]')) $('list').innerHTML = people.map((p, i) => {
    const [icon, obj] = objects[mod(i - w)];
    const mine = reviews.filter(r => r.week === w && r.who === p);
    const done = cleaned[w]?.[p];
    const status = mine.length ? '<span class="score">✅ принято</span>' : done ? '<span class="score">🧹 убрано</span>' : w < today && !note ? '<span class="score muted">не принято</span>' : '';
    const revs = mine.map(r => `<div class="rev"><span class="score">${stars(r.score)}</span> ${esc(r.text || '')} <span class="muted">— ${esc(r.by)}</span>${r.by === me ? `<button class="del" data-edit="reviews" data-id="${esc(r.id)}" title="Изменить">✏️</button><button class="del" data-del="reviews" data-id="${esc(r.id)}" title="Удалить">🗑</button>` : ''}</div>`).join('');
    const def = me && me !== p ? me : boss;
    // своё не оценивают — вместо отзыва отмечают, что убрали, и староста получает уведомление
    const form = note || w > today ? '' : p === me ? (w === today && !done && !mine.length ? `<button data-cleaned="${esc(obj)}">🧹 Убрал объект</button>` : '') : `<details><summary>${mine.length ? 'Добавить отзыв' : 'Принять объект'}</summary><form data-who="${p}">
      <select name="by" aria-label="Кто оценивает">${members.filter(x => x !== p).map(x => `<option${x === def ? ' selected' : ''}>${x}</option>`).join('')}</select>
      <select name="score" aria-label="Оценка">${[5, 4, 3, 2, 1].map(n => `<option value="${n}">${stars(n)}</option>`).join('')}</select>
      <textarea name="text" rows="3" maxlength="500" placeholder="Комментарий"></textarea>
      <button>Отправить</button></form></details>`;
    return `<div class="row${p === me ? ' mine' : ''}"><div class="head"><span class="icon">${icon}</span><div><div class="name">${p}${p === boss ? ' 👑' : ''}</div><div class="muted">${obj}</div></div>${status}</div>${revs}${form}</div>`;
  }).join('');
  shownW = w;

  $('rating').innerHTML = note || people.map(p => {
    const s = reviews.filter(r => r.who === p).map(r => r.score);
    return [p, s.length ? s.reduce((a, b) => a + b) / s.length : 0, s.length];
  }).sort((a, b) => b[1] - a[1]).map(([p, avg, n], i) =>
    `<div class="row head"><span class="icon">${['🥇', '🥈', '🥉', '🧹'][i]}</span><div><div class="name">${p}</div><div class="muted">оценок: ${n}</div></div><span class="score">${n ? avg.toFixed(1) + ' ★' : '—'}</span></div>`
  ).join('');

  // бумага: 8 рулонов — полная полоска
  $('paper').innerHTML = !paper ? note || 'Нет данных' : `<div class="head"><span class="icon">🧻</span><div class="grow"><div class="name">${paper.rolls} ${plural(paper.rolls, ['рулон', 'рулона', 'рулонов'])}</div><div class="muted small">обновил ${esc(paper.by)}, ${stamp(paper.ts)}</div></div><span class="end badge ${pc}">${pw}</span></div>
    <div class="bar"><i class="${pc}" style="width:${Math.max(4, Math.min(100, paper.rolls * 12.5))}%"></i></div>
    <p class="${pc === 'red' ? 'warn' : 'muted small'}">👑 ${pc === 'red' ? `${nowBoss}, пора купить бумагу` : `Следит староста: ${nowBoss}`}</p>
    <div class="ctl"><button data-paper="-1">−1 взял</button><button data-buy="8">+8 купил</button><button data-buy="">другое…</button></div>`;

  // личное: свой объект и деньги за бумагу
  const owe = people.includes(me) ? buys.filter(b => b.by !== me && !b.paid[me]) : [];
  const mineBuys = buys.filter(b => b.by === me && people.some(p => p !== me && !b.paid[p]));
  document.querySelector('.tabs a[href="#my"]').classList.toggle('owe', owe.length > 0);
  const i = people.indexOf(me), [oi, on] = objects[mod(i - today)] || [];
  const st = i < 0 ? '' : reviews.some(r => r.week === today && r.who === me) ? '✅ принято' : cleaned[today]?.[me] ? '🧹 убрано, ждёт старосту' : 'надо убрать';
  $('my').innerHTML = !me ? '<p class="muted">Выбери вверху, кто ты</p>' : note || (i < 0 ? '' : `<h2>На этой неделе</h2><a class="row head" href="#clean"><span class="icon">${oi}</span><div class="grow"><div class="name">${on}</div><div class="muted small">${st}</div></div></a>`)
    + '<h2>С тебя</h2>' + (owe.map(b => `<div class="row head"><span class="icon">🧻</span><div class="grow"><div class="name">${share(b)} ₽ → ${esc(b.by)}</div><div class="muted small">${b.n} ${plural(b.n, ['рулон', 'рулона', 'рулонов'])} за ${b.price} ₽, ${short(new Date(b.ts))}</div></div><button class="end" data-paid="${esc(b.id)}" data-name="${me}">Отдал</button></div>`).join('') || '<p class="muted">Ничего 👌</p>')
    + (mineBuys.length ? '<h2>Тебе должны</h2>' + mineBuys.map(b => `<div class="row"><div class="head"><span class="icon">🧻</span><div class="grow"><div class="name">${b.n} ${plural(b.n, ['рулон', 'рулона', 'рулонов'])} за ${b.price} ₽</div><div class="muted small">${short(new Date(b.ts))}, по ${share(b)} ₽</div></div><button class="del" data-del="buys" data-id="${esc(b.id)}" title="Удалить покупку">🗑</button></div>`
      + people.filter(p => p !== me).map(p => `<div class="rev">${b.paid[p] ? `✓ ${p} отдал` : `${p} — ${share(b)} ₽ <button data-paid="${esc(b.id)}" data-name="${p}">получил</button>`}</div>`).join('') + '</div>').join('') : '');

  const reqRow = r => `<div class="row head${r.done ? ' done' : ''}"><span class="icon">${kinds[r.kind] || '📝'}</span><div class="grow"><div>${esc(r.text)}</div><div class="muted small">${esc(r.by)}, ${short(new Date(r.ts))}${r.done ? ` · ✓ ${esc(r.done.by)}, ${short(new Date(r.done.ts))}` : ''}</div></div>${r.done ? '' : `<button class="end" data-done="${esc(r.id)}">Готово</button>`}${r.by === me && !r.done ? `<button class="del" data-edit="requests" data-id="${esc(r.id)}" title="Изменить">✏️</button>` : ''}${r.by === me ? `<button class="del" data-del="requests" data-id="${esc(r.id)}" title="Удалить">🗑</button>` : ''}</div>`;
  const done = requests.filter(r => r.done).sort((a, b) => b.done.ts - a.done.ts);
  $('requests').innerHTML = note || (open.length ? open.sort((a, b) => b.ts - a.ts).map(reqRow).join('') : '<p class="muted">Открытых заявок нет 👌</p>')
    + (done.length ? `<details class="fold"><summary>Сделано (${done.length})</summary>${done.map(reqRow).join('')}</details>` : '');

  let last = '';
  $('events').innerHTML = note || up.map(e => {
    const d = day(e.date), on = e.votes.includes(me), g = ['Эта неделя', 'Следующая неделя'][weekNow(d) - today] || 'Позже';
    const h = g === last ? '' : `<h3>${g}</h3>`;
    last = g;
    return h + `<div class="row head"><div class="date"><b>${d.getDate()}</b>${d.toLocaleDateString('ru-RU', {month: 'short'})}<br>${d.toLocaleDateString('ru-RU', {weekday: 'short'})}</div>
      <div class="grow"><div class="name">${esc(e.title)}${ok(e) ? ' ✅' : ''}</div><div class="muted small">${e.time ? esc(e.time) + ' · ' : ''}предложил ${esc(e.by)}</div><div class="small">${e.votes.length ? '👍 ' + e.votes.join(', ') : 'пока никто не голосовал'}</div></div>
      <button class="end vote${on ? ' on' : ''}" data-vote="${esc(e.id)}">${on ? '✓ иду' : '👍 за'}</button>${e.by === me ? `<button class="del" data-edit="events" data-id="${esc(e.id)}" title="Изменить">✏️</button><button class="del" data-del="events" data-id="${esc(e.id)}" title="Удалить">🗑</button>` : ''}</div>`;
  }).join('') || '<p class="muted">Пока пусто — предложи, чем заняться на неделе</p>';

  renderCal();
}

function renderCal() {
  const tIso = iso(new Date()), y = cal.getFullYear(), m = cal.getMonth(), byDay = {};
  events.forEach(e => (byDay[e.date] ||= []).push(e));
  let cells = '<span></span>'.repeat((new Date(y, m, 1).getDay() + 6) % 7);
  for (let i = 1; i <= new Date(y, m + 1, 0).getDate(); i++) {
    const k = iso(new Date(y, m, i)), ev = byDay[k];
    cells += `<button class="day${k === tIso ? ' today' : ''}${k === sel ? ' sel' : ''}${k < tIso ? ' past' : ''}${ev ? ev.some(ok) ? ' ok' : ' has' : ''}" data-day="${k}">${i}</button>`;
  }
  const list = (byDay[sel] || []).sort(byWhen);
  $('cal').innerHTML = `<div class="calhead"><button data-month="-1" aria-label="Месяц назад">←</button><b>${cal.toLocaleDateString('ru-RU', {month: 'long'})} ${y}</b><button data-month="1" aria-label="Месяц вперёд">→</button></div>
    <div class="grid">${['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(d => `<span>${d}</span>`).join('')}${cells}</div>`
    + (sel ? `<div class="dayinfo"><b>${day(sel).toLocaleDateString('ru-RU', {weekday: 'long', day: 'numeric', month: 'long'})}</b>${list.map(e => `<div>${ok(e) ? '✅' : '•'} ${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)} <span class="muted">👍 ${e.votes.length}</span></div>`).join('') || '<div class="muted">ничего нет</div>'}${sel >= tIso ? '<button class="link" data-propose="1">＋ предложить на этот день</button>' : ''}</div>` : '');
}

const TABS = ['clean', 'home', 'events', 'my'];
function showTab() {
  const t = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'clean';
  // новый раздел въезжает с той стороны, куда листаешь
  document.body.style.setProperty('--dx', (TABS.indexOf(t) < TABS.indexOf(tab) ? -24 : 24) + 'px');
  tab = t;
  document.querySelectorAll('section').forEach(s => s.hidden = s.dataset.tab !== t);
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.hash === '#' + t));
}

function setMe(v) { me = v; $('me').value = v; try { localStorage.me = v; } catch {} }

function need() {
  if (!me) { alert('Сначала выбери вверху, кто ты'); $('me').focus(); }
  return !!me;
}

async function send(path, method, body, btn) {
  btn.disabled = true;
  const res = await fetch(`${DB}/${path}.json`, {method, body: JSON.stringify(body)}).catch(() => null);
  btn.disabled = false;
  if (!res?.ok) { alert('Не отправилось, попробуй ещё раз'); return false; }
  await load();
  return true;
}

async function load() {
  try {
    const res = await fetch(DB + '/.json');
    if (!res.ok) throw res.status;
    const data = await res.json() || {};
    reviews = Object.entries(data.reviews || {}).map(([id, r]) => ({...r, id})).filter(r => r && people.includes(r.who) && Number.isInteger(r.week) && Number.isInteger(r.score) && r.score >= 1 && r.score <= 5);
    cleaned = data.cleaned || {};
    paper = Number.isInteger(data.paper?.rolls) ? data.paper : null;
    buys = Object.entries(data.buys || {}).map(([id, b]) => ({...b, id, paid: b.paid || {}})).filter(b => Number.isInteger(b.n) && Number.isFinite(b.price) && typeof b.by === 'string');
    requests = Object.entries(data.requests || {}).map(([id, r]) => ({...r, id})).filter(r => typeof r.text === 'string');
    events = Object.entries(data.events || {}).map(([id, e]) => ({...e, id, votes: members.filter(p => e?.votes?.[p])}))
      .filter(e => typeof e.title === 'string' && /^\d{4}-\d\d-\d\d$/.test(e.date));
    note = '';
  } catch { note = 'Не загрузилось — обнови страницу'; }
  render();
}

$('prev').onclick = () => { w--; render(); };
$('next').onclick = () => { w++; render(); };
$('me').innerHTML += members.map(p => `<option>${p}</option>`).join('');
$('me').value = me;
$('me').onchange = e => { setMe(e.target.value); render(); };
$('evForm').elements.date.min = iso(new Date());

$('list').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, d = new FormData(f), id = f.dataset.edit, b = f.querySelector('button');
  const r = {score: +d.get('score'), text: d.get('text').trim()};
  if (!id) setMe(d.get('by'));
  const ok = id ? await send(`reviews/${encodeURIComponent(id)}`, 'PATCH', r, b)
    : await send('reviews', 'POST', {week: w, who: f.dataset.who, by: me, ...r, ts: Date.now()}, b);
  if (ok) f.parentElement.open = false;
});
$('list').addEventListener('toggle', e => e.target.open || render(), true);

$('reqForm').onsubmit = async e => {
  e.preventDefault();
  if (!need()) return;
  const f = e.target, d = new FormData(f);
  const r = {kind: d.get('kind'), text: d.get('text').trim(), by: me, ts: Date.now()};
  if (await send('requests', 'POST', r, f.querySelector('button'))) { f.reset(); notify(`${kinds[r.kind]} ${me}: ${r.text}`, 'home'); }
};

// покупка бумаги: остаток и долг каждому из четверых пишутся одним запросом
$('buyForm').onsubmit = async e => {
  e.preventDefault();
  if (!need()) return;
  const f = e.target, n = +f.elements.n.value, price = +f.elements.price.value, ts = Date.now(), b = {n, price, by: me, ts};
  const ok = await send('', 'PATCH', {paper: {rolls: Math.min(99, (paper?.rolls ?? 0) + n), by: me, ts}, ['buys/' + ts]: b}, f.querySelector('button:not([type])'));
  if (ok) { f.reset(); f.hidden = true; notify(`🧻 ${me} купил ${n} ${plural(n, ['рулон', 'рулона', 'рулонов'])} за ${price} ₽. Скидываемся по ${share(b)} ₽ → ${me}: ${people.filter(p => p !== me).join(', ')}`, 'my'); }
};
$('buyForm').oninput = e => { const p = +e.currentTarget.elements.price.value; $('buyShare').textContent = p ? `С каждого из четверых по ${share({price: p})} ₽` : 'Скидываются все четверо поровну'; };
$('buyCancel').onclick = () => { $('buyForm').reset(); $('buyForm').hidden = true; };

$('evForm').onsubmit = async e => {
  e.preventDefault();
  if (!need()) return;
  const f = e.target, d = new FormData(f), id = f.dataset.edit;
  const ev = {title: d.get('title').trim(), date: d.get('date'), by: me, ts: Date.now(), votes: {[me]: true}};
  if (d.get('time')) ev.time = d.get('time');
  if (id) {
    const old = events.find(e => e.id === id), moved = old && (old.date !== ev.date || (old.time || '') !== (ev.time || ''));
    const patch = {title: ev.title, date: ev.date, time: ev.time || null};
    if (moved) patch.votes = ev.votes; // перенесли — голоса за старую дату не считаем
    if (await send(`events/${encodeURIComponent(id)}`, 'PATCH', patch, f.querySelector('button'))) { $('evFold').open = false; moved && notify(`📅 ${me} перенёс: ${ev.title}, ${when(ev)} — голосуйте заново`, 'events'); }
    return;
  }
  if (await send('events', 'POST', ev, f.querySelector('button'))) { f.reset(); $('evFold').open = false; notify(`🎉 ${me} предлагает: ${ev.title}, ${when(ev)}`, 'events'); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-paper],button[data-buy],button[data-paid],button[data-done],button[data-vote],button[data-day],button[data-month],button[data-propose],button[data-del],button[data-edit],button[data-cleaned]');
  if (!b) return;
  const x = b.dataset;
  if (x.month) { cal.setMonth(cal.getMonth() + +x.month); return renderCal(); }
  if (x.day) { sel = sel === x.day ? '' : x.day; return renderCal(); }
  if (x.propose) { const f = $('evForm').elements; f.date.value = sel; $('evFold').open = true; return f.title.focus(); }
  if (!need()) return;
  // ponytail: два одновременных нажатия бумаги — одно потеряется; транзакция через ETag, если начнёт мешать
  if (x.buy !== undefined) {
    const f = $('buyForm'), el = f.elements;
    f.reset(); el.n.value = x.buy; el.n.hidden = !x.buy; f.hidden = false; f.dispatchEvent(new Event('input'));
    return (x.buy ? el.price : el.n).focus();
  }
  if (x.paid) send(`buys/${encodeURIComponent(x.paid)}/paid/${x.name}`, 'PUT', Date.now(), b);
  if (x.paper) {
    const n = Math.max(0, paper.rolls + +x.paper), was = paper.rolls;
    send('paper', 'PUT', {rolls: n, by: me, ts: Date.now()}, b)
      .then(ok => ok && n <= 2 && n < was && notify(`🧻 Осталось ${n} ${plural(n, ['рулон', 'рулона', 'рулонов'])} бумаги. ${bosses[mod(today)]}, пора купить`, 'home'));
  }
  if (x.cleaned) send(`cleaned/${w}/${me}`, 'PUT', Date.now(), b).then(ok => ok && notify(`🧹 ${me} убрал: ${x.cleaned}. ${bosses[mod(w)]}, прими объект`, 'clean'));
  if (x.done) send(`requests/${encodeURIComponent(x.done)}/done`, 'PUT', {by: me, ts: Date.now()}, b);
  if (x.edit === 'requests') {
    const r = requests.find(r => r.id === x.id), t = prompt('Заявка', r.text)?.trim().slice(0, 200);
    if (t && t !== r.text) send(`requests/${encodeURIComponent(x.id)}`, 'PATCH', {text: t}, b);
  }
  if (x.edit === 'reviews') {
    const r = reviews.find(r => r.id === x.id), f = $('list').querySelector(`form[data-who="${r.who}"]`);
    if (!f) return;
    const el = f.elements;
    f.dataset.edit = r.id; el.by.value = r.by; el.by.disabled = true; el.score.value = r.score; el.text.value = r.text || '';
    f.querySelector('button').textContent = 'Сохранить';
    f.parentElement.open = true; el.text.focus();
  }
  if (x.edit === 'events') {
    const ev = events.find(e => e.id === x.id), f = $('evForm'), el = f.elements;
    f.dataset.edit = ev.id; el.title.value = ev.title; el.date.value = ev.date; el.time.value = ev.time || '';
    f.querySelector('button').textContent = 'Сохранить';
    $('evFold').open = true; el.title.focus();
  }
  if (x.del && confirm('Удалить насовсем?')) send(`${x.del}/${encodeURIComponent(x.id)}`, 'DELETE', undefined, b);
  if (x.vote) {
    const on = b.classList.contains('on'), ev = events.find(e => e.id === x.vote);
    send(`events/${encodeURIComponent(x.vote)}/votes/${me}`, on ? 'DELETE' : 'PUT', on ? undefined : true, b)
      .then(ok => ok && !on && ev.votes.length === 2 && notify(`✅ В силе: ${ev.title}, ${when(ev)} — идут ${[...ev.votes, me].join(', ')}`, 'events'));
  }
});

// закрыл форму посреди правки — правка отменяется (и после сохранения тоже сюда)
$('evFold').ontoggle = e => {
  const f = $('evForm');
  if (e.target.open || !f.dataset.edit) return;
  delete f.dataset.edit; f.reset(); f.querySelector('button').textContent = 'Предложить';
};

onhashchange = showTab;
// свайп влево/вправо листает разделы; вертикальная прокрутка и выделение текста в полях не считаются
let sx, sy;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy) || e.target.closest('input,textarea,select')) return;
  const t = TABS[Math.max(0, TABS.indexOf(location.hash.slice(1))) + (dx < 0 ? 1 : -1)];
  if (t) location.hash = t;
});
showTab();
render();
load();
// живое обновление: Firebase шлёт событие при любом изменении базы, свайп не нужен
const live = new EventSource(DB + '/.json');
live.addEventListener('put', load);
live.addEventListener('patch', load);

// с иконки на телефоне страница висит открытой днями: при возврате подтягиваем свежие данные, с новой неделей перезагружаемся
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (weekNow() !== today) location.reload(); else load(); });
</script>
</body>
