name: Напоминание об уборке
on:
  schedule:
    - cron: '0 21 * * 2' # среда, 00:00 МСК — итоги недели
    - cron: '0 21 * * 0' # понедельник, 00:00 МСК — началась уборка
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/remind.js
